<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>eTitleDirect — Modern Title &amp; Transaction Coordination</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────
   eTitleDirect — Modern transaction infrastructure
   References: Stripe · Linear · Ramp · Notion
   ───────────────────────────────────────────────────────── */
:root{
  --navy:        #0E1B36;
  --navy-deep:   #081229;
  --navy-soft:   #16264A;

  --blue:        #2B6CF6;
  --blue-deep:   #1F56D6;
  --blue-soft:   #EAF1FF;
  --blue-line:   #C2D6FB;
  --blue-ink:    #1B4FD1;

  --green:       #14B24C;
  --green-bright:#2BD06A;
  --green-soft:  #E6F9EE;
  --green-line:  #B4ECC6;

  --ink:         #0B1426;
  --ink-2:       #2D3748;
  --ink-3:       #5A6478;
  --ink-mute:    #8A93A6;

  --line:        #E6E9F0;
  --line-soft:   #EEF0F5;
  --bg:          #FFFFFF;
  --bg-soft:     #F7F8FB;
  --bg-warm:     #F3F5F9;

  --radius-s: 8px;
  --radius:   12px;
  --radius-l: 18px;
  --radius-xl: 24px;

  --max:      1200px;
  --pad:      28px;

  --font:     'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:     'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --shadow-sm: 0 1px 2px rgba(11,20,38,0.05);
  --shadow:    0 8px 24px rgba(11,20,38,0.06), 0 1px 2px rgba(11,20,38,0.04);
  --shadow-lg: 0 24px 60px rgba(11,20,38,0.10), 0 4px 12px rgba(11,20,38,0.04);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-size:16px;
  line-height:1.55;
  font-weight:400;
  letter-spacing:-0.005em;
  font-feature-settings:"cv11","ss01","ss03";
}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--green-bright);color:var(--navy)}

.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad);width:100%}

/* ── TYPE ── */
.eyebrow{
  display:inline-flex;align-items:center;gap:.5rem;
  font-size:.78rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--blue);
}
.eyebrow .pip{width:6px;height:6px;border-radius:99px;background:var(--blue);display:inline-block}
.eyebrow.green{color:var(--green)}
.eyebrow.green .pip{background:var(--green)}
.eyebrow.muted{color:var(--ink-3)}
.eyebrow.muted .pip{background:var(--ink-mute)}

h1,h2,h3,h4,h5{letter-spacing:-0.025em;line-height:1.08;font-weight:700;color:var(--ink)}
.h1{font-size:clamp(2.8rem, 4.8vw, 4.2rem);letter-spacing:-0.035em;line-height:1.01;font-weight:700}
.h2{font-size:clamp(2rem, 3.4vw, 2.8rem);letter-spacing:-0.03em;line-height:1.05;font-weight:700}
.h3{font-size:clamp(1.3rem, 1.9vw, 1.55rem);font-weight:700}
.lead{font-size:1.1rem;color:var(--ink-3);line-height:1.6;max-width:560px;font-weight:400}
.mono{font-family:var(--mono);font-feature-settings:"tnum";font-variant-numeric:tabular-nums}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.78rem 1.2rem;border-radius:8px;
  font-weight:600;font-size:.92rem;letter-spacing:-0.005em;
  transition:transform .18s, box-shadow .18s, background .18s, color .18s, border-color .18s;
  white-space:nowrap;border:1px solid transparent;
}
.btn .arrow{display:inline-block;width:13px;height:13px;transition:transform .18s}
.btn:hover .arrow{transform:translateX(3px)}

.btn-primary{
  background:var(--blue);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 1px 2px rgba(43,108,246,0.22);
}
.btn-primary:hover{background:var(--blue-deep);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 8px 18px rgba(43,108,246,0.36)}

.btn-secondary{
  background:#fff;color:var(--blue);border-color:var(--blue-line);
  box-shadow:var(--shadow-sm);
}
.btn-secondary:hover{border-color:var(--blue);background:var(--blue-soft)}

.btn-sm{padding:.55rem .95rem;font-size:.85rem;border-radius:7px}

.link{
  display:inline-flex;align-items:center;gap:.4rem;
  font-weight:600;font-size:.9rem;color:var(--blue);transition:gap .18s;
}
.link:hover{gap:.6rem}

/* ─────────────────────────────────────────────────────────
   NAV
   ───────────────────────────────────────────────────────── */
nav.top{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,0.72);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .2s, background .2s;
}
nav.top.scrolled{
  background:rgba(255,255,255,0.92);
  border-bottom-color:var(--line);
}
.nav-inner{
  max-width:var(--max);margin:0 auto;padding:14px var(--pad);
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  position:relative;
}
.logo{display:flex;align-items:center;gap:8px;z-index:2}
.logo-mark{
  font-family:var(--font);font-weight:700;font-size:1.18rem;
  letter-spacing:-0.025em;color:var(--ink);line-height:1;
}
.logo-mark .e{color:var(--blue);font-weight:700}
.nav-links{display:flex;align-items:center;gap:1.3rem}
.nav-link{
  font-size:.88rem;color:var(--ink-2);font-weight:500;
  padding:6px 0;transition:color .18s;
  display:inline-flex;align-items:center;gap:5px;
}
.nav-link:hover{color:var(--ink)}
.nav-link.has-caret::after{
  content:"";width:0;height:0;border:3.5px solid transparent;
  border-top-color:currentColor;transform:translateY(2px);opacity:.6;
}
.nav-right{display:flex;align-items:center;gap:14px;z-index:2}
.nav-link-quiet{font-size:.88rem;color:var(--ink-2);font-weight:500;padding:6px 0;transition:color .18s}
.nav-link-quiet:hover{color:var(--ink)}
.nav-burger{display:none;width:22px;height:16px;flex-direction:column;justify-content:space-between}
.nav-burger span{height:1.5px;background:var(--ink);border-radius:2px;display:block;width:100%}

/* ── NAV DROPDOWNS ── */
.nav-item{position:relative}
.nav-item:hover .nav-dropdown{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.nav-dropdown{
  position:absolute;top:calc(100% + 12px);left:50%;
  transform:translateX(-50%) translateY(6px);
  background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-lg);
  padding:6px;min-width:200px;
  opacity:0;visibility:hidden;
  transition:opacity .18s ease, transform .18s ease, visibility .18s ease;
  z-index:200;
}
.nav-dropdown::before{
  content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:100%;height:12px;background:transparent;
}
.nav-dd-item{
  display:flex;flex-direction:column;gap:2px;
  padding:9px 12px;border-radius:8px;
  font-size:.88rem;color:var(--ink-2);font-weight:500;
  transition:background .15s, color .15s;cursor:pointer;
}
.nav-dd-item:hover{background:var(--bg-soft);color:var(--ink)}
.nav-dd-item .dd-sub{
  font-size:.75rem;color:var(--ink-mute);font-weight:400;margin-top:1px;
}
.nav-dd-divider{height:1px;background:var(--line);margin:4px 0}

/* ─────────────────────────────────────────────────────────
   HERO
   ───────────────────────────────────────────────────────── */
.hero{
  position:relative;background:var(--bg);
  padding:170px 0 0;overflow:visible;isolation:isolate;
}
.hero-bg-img{
  position:absolute;inset:0;z-index:0;
  background:url('../hero-bg.jpg.jpg') center/cover no-repeat;
  opacity:0.22;
}
.hero::before{
  content:"";position:absolute;inset:0;z-index:0;
  background-image:radial-gradient(rgba(11,20,38,0.07) 1px, transparent 1px);
  background-size:22px 22px;
  mask-image:radial-gradient(ellipse 85% 65% at 60% 30%, #000 25%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 85% 65% at 60% 30%, #000 25%, transparent 80%);
}
.hero::after{
  content:"";position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(circle at 88% 12%, rgba(46,200,102,0.07), transparent 45%),
    radial-gradient(circle at 6% 88%, rgba(27,95,232,0.06), transparent 50%);
}
.hero-inner{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:flex-end;
  max-width:var(--max);margin:0 auto;padding-bottom:80px;
}
.hero-copy{padding-bottom:40px}
.hero-copy .eyebrow{margin-bottom:24px;justify-content:flex-start}
.hero-copy h1{margin-bottom:22px;text-align:left}
.hero-copy h1 .accent{color:var(--blue);font-weight:700}
.hero-copy .lead{margin-bottom:32px;font-size:1.18rem;max-width:520px;margin-left:0;margin-right:0;text-align:left}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-start;margin-bottom:30px}
.hero-meta{
  display:flex;gap:32px;flex-wrap:wrap;justify-content:center;
  padding-top:24px;border-top:1px solid var(--line);margin-top:8px;
}
.hero-meta .mi{
  font-size:.78rem;color:var(--ink-3);
  display:flex;align-items:center;gap:8px;font-weight:500;letter-spacing:.005em;
}
.hero-meta .mi svg{color:var(--green);flex-shrink:0}

/* Hero Visual — TytlLab dashboard panel */
.hv{
  position:relative;height:560px;
  margin-right:calc(-1 * var(--pad) - 20px);
  margin-bottom:-120px;
  align-self:flex-end;
}
.hv-window{
  position:absolute;inset:0;
  background:rgba(255,255,255,0.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(226,232,240,0.55);
  border-radius:14px 14px 0 0;
  box-shadow:0 24px 60px rgba(11,20,38,0.10),0 2px 8px rgba(11,20,38,0.05);
  overflow:hidden;display:flex;flex-direction:column;
  mask-image:linear-gradient(to bottom,black 50%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,black 50%,transparent 100%);
}
.hv-titlebar{
  height:36px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:var(--bg-soft);
  display:flex;align-items:center;gap:8px;padding:0 12px;
}
.hv-traffic{display:flex;gap:6px}
.hv-traffic span{width:10px;height:10px;border-radius:99px;background:#dcdfe6}
.hv-url{
  flex:1;height:22px;border-radius:5px;
  background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;padding:0 10px;
  font-size:.68rem;color:var(--ink-3);font-family:var(--mono);font-weight:500;
  max-width:280px;margin:0 auto;
}
.hv-url .lock{margin-right:6px;color:var(--green);display:inline-flex}
.hv-body{flex:1;display:grid;grid-template-columns:170px 1fr;min-height:0}

.hv-rail{
  border-right:1px solid var(--line);padding:14px 10px;
  display:flex;flex-direction:column;gap:1px;
}
.hv-rail-label{
  font-size:.6rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-mute);padding:4px 8px 8px;
}
.hv-rail-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:6px;
  font-size:.76rem;color:var(--ink-2);font-weight:500;
}
.hv-rail-item.active{background:var(--bg-soft);color:var(--ink);font-weight:600}
.hv-rail-item .pdot{width:7px;height:7px;border-radius:99px;flex-shrink:0;background:var(--ink-mute)}
.hv-rail-item.active .pdot{background:var(--green)}
.hv-rail-item .count{
  margin-left:auto;font-size:.66rem;color:var(--ink-mute);
  font-family:var(--mono);font-weight:500;
}
.hv-rail-item.active .count{color:var(--ink-2)}
.hv-rail-divider{height:1px;background:var(--line);margin:8px 4px}

.hv-main{
  padding:0 0 18px;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(180deg,#fff 0%,#fafbfd 100%);
}
.hv-main > .hv-main-head,
.hv-main > .hv-timeline,
.hv-main > .hv-row2{margin-left:18px;margin-right:18px}

.hv-bluehead{
  background:linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
  color:#fff;padding:18px 20px 22px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:14px;
  position:relative;overflow:hidden;
}
.hv-bluehead::after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1px);
  background-size:14px 14px;
  mask-image:linear-gradient(90deg, transparent 40%, #000 100%);
  -webkit-mask-image:linear-gradient(90deg, transparent 40%, #000 100%);
  pointer-events:none;
}
.hv-bluehead > *{position:relative;z-index:1}
.hv-bluehead-tag{
  font-size:.62rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,0.78);font-family:var(--mono);
}
.hv-bluehead-amt{
  font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;color:#fff;margin-top:4px;
}
.hv-status.light{
  background:rgba(255,255,255,0.18);color:#fff;
  backdrop-filter:blur(4px);
}
.hv-status.light .dot{background:var(--green-bright);box-shadow:0 0 0 3px rgba(46,200,102,0.25)}
.hv-main-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.hv-file{font-size:.66rem;color:var(--ink-mute);letter-spacing:.04em;font-weight:600;font-family:var(--mono)}
.hv-status{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 9px;border-radius:99px;
  font-size:.68rem;font-weight:600;letter-spacing:.01em;
  background:var(--green-soft);color:var(--green);
}
.hv-status .dot{width:6px;height:6px;border-radius:99px;background:var(--green)}

.hv-timeline{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.hv-timeline-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hv-timeline-h .title{font-size:.76rem;font-weight:600;color:var(--ink)}
.hv-timeline-h .pct{font-size:.7rem;color:var(--ink-3);font-family:var(--mono);font-weight:500}
.hv-bar{height:4px;background:var(--bg-warm);border-radius:99px;overflow:hidden;margin-bottom:14px}
.hv-bar .fill{height:100%;background:linear-gradient(90deg,var(--green-bright),var(--blue));border-radius:99px;width:62%}
.hv-steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hv-step{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:6px 4px;border-radius:6px}
.hv-step .ring{
  width:14px;height:14px;border-radius:99px;
  border:1.5px solid var(--ink-mute);background:#fff;position:relative;
}
.hv-step.done .ring{background:var(--green);border-color:var(--green)}
.hv-step.done .ring::after{
  content:"";position:absolute;left:3px;top:1.5px;
  width:4px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);
}
.hv-step.now .ring{border-color:var(--blue);background:rgba(27,95,232,0.12)}
.hv-step .lbl{font-size:.6rem;color:var(--ink-3);font-weight:500;line-height:1.25}
.hv-step.now .lbl{color:var(--ink);font-weight:600}
.hv-step.done .lbl{color:var(--ink-2)}

.hv-row2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.hv-card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;display:flex;flex-direction:column;gap:10px}
.hv-card .label{font-size:.66rem;color:var(--ink-mute);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hv-card .value{font-size:1.4rem;font-weight:700;color:var(--ink);letter-spacing:-0.025em;line-height:1}
.hv-card .delta{font-size:.7rem;color:var(--green);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.hv-spark{height:34px;margin-top:auto}
.hv-activity{display:flex;flex-direction:column;gap:6px;padding:0;margin:0}
.hv-activity li{
  display:flex;align-items:center;gap:8px;
  font-size:.7rem;color:var(--ink-2);font-weight:500;
  padding:6px 0;border-bottom:1px solid var(--line-soft);
}
.hv-activity li:last-child{border-bottom:none}
.hv-activity .pdot{width:6px;height:6px;border-radius:99px;background:var(--green);flex-shrink:0}
.hv-activity .pdot.blue{background:var(--blue)}
.hv-activity .pdot.mute{background:var(--ink-mute)}
.hv-activity .when{margin-left:auto;color:var(--ink-mute);font-family:var(--mono);font-size:.65rem}

/* Floating badges */
.hv-badge{
  position:absolute;background:#fff;border:1px solid var(--line);
  border-radius:99px;padding:8px 14px 8px 10px;
  box-shadow:0 12px 32px rgba(11,20,38,0.10);
  display:flex;align-items:center;gap:8px;
  font-size:.78rem;font-weight:600;color:var(--ink);
}
.hv-badge .pulse{
  width:9px;height:9px;border-radius:99px;background:var(--green-bright);
  box-shadow:0 0 0 0 rgba(46,200,102,0.6);animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(46,200,102,0.6)}
  70%{box-shadow:0 0 0 8px rgba(46,200,102,0)}
  100%{box-shadow:0 0 0 0 rgba(46,200,102,0)}
}
.hv-badge.tl{left:-22px;top:48px}
.hv-badge.br{right:-22px;bottom:60px;padding:8px 12px}
.hv-badge.br .num{font-family:var(--mono);font-weight:700;color:var(--green)}

/* Recently closed ticker */
.closed{background:var(--bg);border-bottom:1px solid var(--line);padding:36px 0;overflow:hidden}
.closed-header{max-width:var(--max);margin:0 auto 18px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between}
.closed-label{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.closed-count{font-size:.8rem;font-weight:500;color:var(--ink-mute)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse-dot 2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.ticker-wrap{overflow:hidden}
.ticker-track{display:flex;gap:10px;animation:ticker 42s linear infinite;width:max-content}
.ticker-track:hover{animation-play-state:paused}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{display:flex;align-items:center;gap:10px;background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:9px 16px;white-space:nowrap;flex-shrink:0}
.ticker-check{width:18px;height:18px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ticker-check svg{width:10px;height:10px;fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ticker-addr{font-size:.78rem;font-weight:600;color:var(--ink)}
.ticker-city{font-size:.7rem;color:var(--ink-mute);margin-top:1px}

/* Trust strip */
.trustbar{
  background:var(--bg);padding:30px 0 70px;position:relative;
}
.trustbar-inner{
  display:flex;align-items:center;gap:32px;flex-wrap:wrap;
  padding-top:36px;border-top:1px solid var(--line);
}
.trustbar-label{
  font-size:.74rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-mute);
}
.trustbar-row{display:flex;align-items:center;gap:40px;flex-wrap:wrap;flex:1}
.partner{
  font-family:var(--font);font-weight:600;font-size:1rem;
  color:var(--ink-3);letter-spacing:-0.01em;opacity:.7;
  transition:opacity .2s;
}
.partner:hover{opacity:1}
.partner.alta{font-weight:800;letter-spacing:.15em;font-size:.9rem}
.partner.fnma{font-weight:700;letter-spacing:.05em}
.partner.stewart{font-style:italic;font-weight:500}
.partner.firstam{font-weight:700;font-size:.95rem;letter-spacing:-0.02em}
.partner.oldrep{font-weight:800;font-size:.78rem;letter-spacing:.1em}

/* ─────────────────────────────────────────────────────────
   SECTION SHELL
   ───────────────────────────────────────────────────────── */
.section{padding:100px 0;position:relative}
.section-soft{background:var(--bg-soft);border-top:1px solid var(--line)}
.section-light{
  background:var(--bg-soft);color:var(--ink);position:relative;overflow:hidden;
  border-top:1px solid var(--line);
}
.section-light::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 88% 12%, rgba(43,108,246,0.06), transparent 45%),
    radial-gradient(circle at 6% 88%, rgba(20,178,76,0.05), transparent 50%);
  pointer-events:none;
}

.section-head{margin-bottom:60px;max-width:760px}
.section-head .eyebrow{margin-bottom:18px}
.section-head h2{margin-bottom:20px;text-wrap:balance}
.section-head .lead{font-size:1.15rem}
.section-head.center{margin-left:auto;margin-right:auto;text-align:center}
.section-head.center .eyebrow{justify-content:center}

/* ─────────────────────────────────────────────────────────
   OPERATIONAL DIFFERENCE
   ───────────────────────────────────────────────────────── */
.op-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);
  border-radius:var(--radius-l);overflow:hidden;
}
.op-cell{
  background:#fff;padding:36px 32px;
  display:flex;flex-direction:column;gap:14px;
  position:relative;transition:background .18s;
}
.op-cell:hover{background:var(--bg-soft)}
.op-num{
  font-family:var(--mono);font-size:.72rem;font-weight:600;
  color:var(--ink-mute);letter-spacing:.08em;
}
.op-cell h3{font-size:1.18rem;font-weight:700;letter-spacing:-0.02em;color:var(--ink)}
.op-cell p{font-size:.96rem;color:var(--ink-3);line-height:1.6}
